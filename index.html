
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>code easy</title>
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #web-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 12px;
        }

        .language-panel {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 24px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .language-panel.hidden {
            display: none;
        }

        .file-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .language-panel textarea {
            width: 100%;
            max-width: 100%;
            min-width: 280px;
            height: 300px;
            resize: vertical;
            margin-bottom: 12px;
            font-family: monospace;
            padding: 8px;
            box-sizing: border-box;
        }

        .panel-menu {
            display: grid;
            gap: 8px;
        }

        .panel-menu label,
        .panel-menu select,
        .panel-menu input,
        .panel-menu button {
            font-size: 14px;
        }

        .select-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        .customization-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-top: 4px;
        }

        .customization-controls.hidden {
            display: none;
        }

        .customization-controls label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }

        .customization-controls input,
        .customization-controls select {
            min-width: 140px;
        }

        .download-btn {
            width: fit-content;
        }

        #language-selector {
            margin-bottom: 16px;
        }

        #output {
            height: 325px;
            width: 100%;
            max-width: 100%;
            min-width: 280px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        @media (max-width: 900px) {
            #web-page {
                padding: 12px;
            }

            #html-code,
            #css-code,
            #js-code,
            #output {
                position: relative;
                display: block;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                left: auto;
                right: auto;
                top: auto;
                bottom: auto;
            }

            #html-code {
                height: 300px;
                margin-bottom: 12px;
            }

            #output {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="web-page">
        <div id="language-selector">
            <label>
                Language:
                <select id="language">
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="js">JS</option>
                </select>
            </label>
        </div>

        <div class="language-panel active" id="panel-html" data-lang="html">
            <div class="file-title">index.html</div>
            <textarea id="html-code"></textarea>
            <div class="panel-menu">
                <div class="selectArea" id="selectArea-html">
                    <div class="select-container">
                        <label>
                            Choose an option:
                            <select class="tag-select">
                                <option value="">-- Select --</option>
                                <option value="<html>">Open html</option>
                                <option value="</html>">Close html</option>
                                <option value="<head>">Open head</option>
                                <option value="</head>">Close head</option>
                                <option value="<body>">Open body</option>
                                <option value="</body>">Close body</option>
                                <option value="<button></button>">Button</option>
                                <option value="<input>">Input</option>
                                <option value="<div>">Open Div</option>
                                <option value="</div>">Close Div</option>
                                <option value="\n">Callback</option>
                            </select>
                        </label>
                    </div>
                </div>
                <button class="addSelectBtn" data-lang="html">Add Another tag</button>
                <label for="linkSelect-html">Link type:</label>
                <select class="linkSelect" id="linkSelect-html">
                    <option value="">-- Select --</option>
                    <option value="none">None</option>
                    <option value="google">Google</option>
                </select>
                <br>
                <label for="customTag-html">Custom tag:</label>
                <input class="customTag" id="customTag-html" type="text" placeholder="e.g. button">
                <label for="customUrl-html">Custom URL:</label>
                <input class="customUrl" id="customUrl-html" type="text" placeholder="e.g. https://example.com">
                <br>
                <button class="addBtn" data-lang="html">Add to Textarea</button>
                <button class="clearBtn" data-lang="html">Clear Textarea</button>
                <button class="download-btn" data-file="index.html" data-lang="html">Download index.html</button>
                <span class="info"></span>
            </div>
        </div>

        <div class="language-panel hidden" id="panel-css" data-lang="css">
            <div class="file-title">style.css</div>
            <textarea id="css-code"></textarea>
            <div class="panel-menu">
                <div class="selectArea" id="selectArea-css">
                    <div class="select-container">
                        <label>
                            Choose an option:
                            <select class="tag-select">
                                <option value="">-- Select --</option>
                                <option value="button{\n\n}">button</option>
                                <option value="input{\n\n}">input</option>
                                <option value="body{\n\n}">body</option>
                                <option value="div{\n\n}">div</option>
                                <option value="\n">Callback</option>
                            </select>
                        </label>
                    </div>
                </div>
                <button class="addSelectBtn" data-lang="css">Add Another tag</button>
                <label for="customTag-css">Custom CSS:</label>
                <input class="customTag" id="customTag-css" type="text" placeholder="e.g. body { color: red; }">
                <br>
                <button class="addBtn" data-lang="css">Add to Textarea</button>
                <button class="clearBtn" data-lang="css">Clear Textarea</button>
                <button class="download-btn" data-file="style.css" data-lang="css">Download style.css</button>
                <span class="info"></span>
            </div>
        </div>

        <div class="language-panel hidden" id="panel-js" data-lang="js">
            <div class="file-title">index.js</div>
            <textarea id="js-code"></textarea>
            <div class="panel-menu">
                <div class="selectArea" id="selectArea-js">
                    <div class="select-container">
                        <label>
                            Choose an option:
                            <select class="tag-select">
                                <option value="">-- Select --</option>
                                <option value="function myFunction() {\n  \n}">Function</option>
                                <option value="console.log('');">console.log</option>
                                <option value="document.querySelector('');">Query selector</option>
                                <option value="\n">Callback</option>
                            </select>
                        </label>
                    </div>
                </div>
                <button class="addSelectBtn" data-lang="js">Add Another tag</button>
                <label for="customTag-js">Custom JS:</label>
                <input class="customTag" id="customTag-js" type="text" placeholder="e.g. console.log('Hello');">
                <br>
                <button class="addBtn" data-lang="js">Add to Textarea</button>
                <button class="clearBtn" data-lang="js">Clear Textarea</button>
                <button class="download-btn" data-file="index.js" data-lang="js">Download index.js</button>
                <span class="info"></span>
            </div>
        </div>

        <iframe id="output" srcdoc="<!doctype html><html><body></body></html>"></iframe>
        <button onclick="runCode()">Run Code</button>
        <button id="resetIframeBtn">Reset Iframe</button>
    </div>
<script>
function runCode() {
    const htmlCode = document.getElementById("html-code").value;
    const cssCode = document.getElementById("css-code").value;
    const jsCode = document.getElementById("js-code").value;
    const iframe = document.getElementById("output");

    const cssLinkRegex = /<link\s+[^>]*rel=["']stylesheet["'][^>]*href=["']style\.css["'][^>]*>/gi;
    const styleHrefRegex = /<style\s+[^>]*href=["']style\.css["'][^>]*>([\s\S]*?)<\/style>/gi;
    const scriptSrcRegex = /<script\s+[^>]*src=["']index\.js["'][^>]*><\/script>/gi;

    let renderedHtml = htmlCode;
    renderedHtml = renderedHtml.replace(cssLinkRegex, `<style>${cssCode}</style>`);
    renderedHtml = renderedHtml.replace(styleHrefRegex, `<style>${cssCode}</style>`);
    renderedHtml = renderedHtml.replace(scriptSrcRegex, `<script>${jsCode}<\\/script>`);

    const hasHead = /<head[\s>]/i.test(renderedHtml);
    const hasBodyClose = /<\/body>/i.test(renderedHtml);

    if (!cssLinkRegex.test(htmlCode) && !styleHrefRegex.test(htmlCode) && cssCode.trim()) {
        if (hasHead) {
            renderedHtml = renderedHtml.replace(/<\/head>/i, `<style>${cssCode}</style></head>`);
        } else if (hasBodyClose) {
            renderedHtml = renderedHtml.replace(/<\/body>/i, `<style>${cssCode}</style></body>`);
        } else {
            renderedHtml += `<style>${cssCode}</style>`;
        }
    }

    if (!scriptSrcRegex.test(htmlCode) && jsCode.trim()) {
        if (hasBodyClose) {
            renderedHtml = renderedHtml.replace(/<\/body>/i, `<script>${jsCode}<\\/script></body>`);
        } else {
            renderedHtml += `<script>${jsCode}<\\/script>`;
        }
    }

    iframe.srcdoc = renderedHtml || "<!doctype html><html><body></body></html>";
}

function resetIframe() {
    const iframe = document.getElementById("output");
    iframe.srcdoc = "<!doctype html><html><body></body></html>";
}

document.getElementById("resetIframeBtn").addEventListener("click", resetIframe);

const optionsByLanguage = {
    html: [
        { value: "", text: "-- Select --", id: "" },
        { value: "<html>", text: "Open html", id: "" },
        { value: "</html>", text: "Close html", id: "" },
        { value: "<head>", text: "Open head", id: "" },
        { value: "</head>", text: "Close head", id: "" },
        { value: "<body>", text: "Open body", id: "" },
        { value: "</body>", text: "Close body", id: "" },
        { value: "<button></button>", text: "Button", id: "" },
        { value: "<input>", text: "Input", id: "" },
        { value: "<div>", text: "Open Div", id: "" },
        { value: "</div>", text: "Close Div", id: "" },
        { value: "\n", text: "Callback", id: "" }
    ],
    css: [
        { value: "", text: "-- Select --",},
        { value: "body {\n  \n}", text: "Body" },
        { value: "div {\n  \n}", text: "Div" },
        { value: "button {\n  \n}", text: "Button" },
        { value: "input {\n  \n}", text: "Input" },
        { value: "\n", text: "Callback" }
    ],
    js: [
        { value: "", text: "-- Select --" },
        { value: "function myFunction() {\n  \n}", text: "Function" },
        { value: "console.log('Hello');", text: "Console log" },
        { value: "document.querySelector('');", text: "Query selector" },
        { value: "\n", text: "Callback" }
    ]
};

function setLanguage(lang) {
    document.querySelectorAll(".language-panel").forEach(panel => {
        panel.classList.toggle("hidden", panel.dataset.lang !== lang);
    });
}

function getCustomTagMarkup(panel) {
    const customTag = panel.querySelector(".customTag").value.trim();
    if (!customTag) return "";

    const lang = panel.dataset.lang;
    if (lang === "html") {
        const normalizedTag = customTag.trim().toLowerCase();
        const voidElements = new Set(["area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"]);
        if (voidElements.has(normalizedTag)) {
            return `<${customTag}>`;
        }
        return `<${customTag}></${customTag}>`;
    }

    return customTag;
}

function getOptions(panel) {
    const lang = panel.dataset.lang || "html";
    const currentOptions = [...(optionsByLanguage[lang] || optionsByLanguage.html)];
    const customTagMarkup = getCustomTagMarkup(panel);

    if (customTagMarkup) {
        const customTagName = panel.querySelector(".customTag").value.trim();
        const alreadyExists = currentOptions.some(option => option.value === customTagMarkup);

        if (!alreadyExists) {
            currentOptions.push({
                value: customTagMarkup,
                text: `Custom: ${customTagName}`
            });
        }
    }

    return currentOptions;
}

function populateSelect(select) {
    const panel = select.closest(".language-panel");
    const currentValue = select.value;
    select.innerHTML = "";

    getOptions(panel).forEach(opt => {
        const option = document.createElement("option");
        option.value = opt.value;
        option.textContent = opt.text;
        if (opt.id) {
            option.id = opt.id;
        }
        select.appendChild(option);
    });

    if (currentValue) {
        select.value = currentValue;
    }
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function escapeAttribute(value) {
    return escapeHtml(value).replace(/"/g, "&quot;");
}

function getTagNameFromValue(value) {
    const match = value.match(/^<\s*([a-zA-Z0-9-]+)/);
    if (!match) return "";
    return match[1].toLowerCase();
}

function getCustomizationSchema(panel, value) {
    if (!panel || !value) return null;

    if (panel.dataset.lang === "html") {
        const tagName = getTagNameFromValue(value);
        if (!tagName) return null;

        if (tagName === "input") {
            return {
                kind: "input",
                inputTypes: ["text", "password", "email", "number", "checkbox", "radio", "submit", "button"],
                contentLabel: "Text/value",
                idLabel: "ID"
            };
        }

        if (["button", "div", "p", "span", "h1", "h2", "h3", "h4", "h5", "h6"].includes(tagName)) {
            return {
                kind: "text",
                contentLabel: "Text content",
                idLabel: "ID"
            };
        }

        return null;
    }

    if (panel.dataset.lang === "css") {
        const normalized = String(value).trim();
        if (!normalized || normalized === "\n") return null;
        return {
            kind: "css-rule",
            propertyLabel: "Property",
            valueLabel: "Value"
        };
    }

    if (panel.dataset.lang === "js") {
        const normalized = String(value).trim();
        if (!normalized || normalized === "\n") return null;

        if (normalized.includes("function")) {
            return {
                kind: "function",
                nameLabel: "Function name",
                bodyLabel: "Body"
            };
        }

        if (normalized.includes("console.log")) {
            return {
                kind: "console-log",
                messageLabel: "Message"
            };
        }

        if (normalized.includes("querySelector")) {
            return {
                kind: "query-selector",
                selectorLabel: "Selector"
            };
        }

        return null;
    }

    return null;
}

function createCustomizationControls(container, select) {
    const existingControls = container.querySelector(".customization-controls");
    if (existingControls) {
        existingControls.remove();
    }

    const controls = document.createElement("div");
    controls.className = "customization-controls hidden";
    container.appendChild(controls);

    return controls;
}

function updateCustomizationControls(container, select) {
    const controls = container.querySelector(".customization-controls") || createCustomizationControls(container, select);
    controls.innerHTML = "";

    const panel = select.closest(".language-panel");
    const schema = getCustomizationSchema(panel, select.value);

    if (!schema) {
        controls.classList.add("hidden");
        return;
    }

    controls.classList.remove("hidden");

    if (schema.kind === "input") {
        const typeLabel = document.createElement("label");
        typeLabel.textContent = "Input type:";
        const typeSelect = document.createElement("select");
        typeSelect.dataset.role = "input-type";
        schema.inputTypes.forEach(type => {
            const option = document.createElement("option");
            option.value = type;
            option.textContent = type;
            typeSelect.appendChild(option);
        });
        typeLabel.appendChild(typeSelect);
        controls.appendChild(typeLabel);

        if (schema.idLabel) {
            const idLabel = document.createElement("label");
            idLabel.textContent = `${schema.idLabel}:`;
            const idInput = document.createElement("input");
            idInput.type = "text";
            idInput.placeholder = "e.g. submitBtn";
            idInput.dataset.role = "id";
            idLabel.appendChild(idInput);
            controls.appendChild(idLabel);
        }

        const valueLabel = document.createElement("label");
        valueLabel.textContent = "Text/value:";
        const valueInput = document.createElement("input");
        valueInput.type = "text";
        valueInput.placeholder = "e.g. Submit";
        valueInput.dataset.role = "content";
        valueLabel.appendChild(valueInput);
        controls.appendChild(valueLabel);
    } else if (schema.kind === "text") {
        if (schema.idLabel) {
            const idLabel = document.createElement("label");
            idLabel.textContent = `${schema.idLabel}:`;
            const idInput = document.createElement("input");
            idInput.type = "text";
            idInput.placeholder = "e.g. heroTitle";
            idInput.dataset.role = "id";
            idLabel.appendChild(idInput);
            controls.appendChild(idLabel);
        }

        const textLabel = document.createElement("label");
        textLabel.textContent = "Text content:";
        const textInput = document.createElement("input");
        textInput.type = "text";
        textInput.placeholder = "e.g. Hello";
        textInput.dataset.role = "content";
        textLabel.appendChild(textInput);
        controls.appendChild(textLabel);
    } else if (schema.kind === "css-rule") {
        const propertyLabel = document.createElement("label");
        propertyLabel.textContent = "Property:";
        const propertyInput = document.createElement("input");
        propertyInput.type = "text";
        propertyInput.placeholder = "e.g. color";
        propertyInput.dataset.role = "property";
        propertyLabel.appendChild(propertyInput);
        controls.appendChild(propertyLabel);

        const valueLabel = document.createElement("label");
        valueLabel.textContent = "Value:";
        const valueInput = document.createElement("input");
        valueInput.type = "text";
        valueInput.placeholder = "e.g. red";
        valueInput.dataset.role = "value";
        valueLabel.appendChild(valueInput);
        controls.appendChild(valueLabel);
    } else if (schema.kind === "function") {
        const nameLabel = document.createElement("label");
        nameLabel.textContent = "Function name:";
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = "e.g. greet";
        nameInput.dataset.role = "name";
        nameLabel.appendChild(nameInput);
        controls.appendChild(nameLabel);

        const bodyLabel = document.createElement("label");
        bodyLabel.textContent = "Body:";
        const bodyInput = document.createElement("input");
        bodyInput.type = "text";
        bodyInput.placeholder = "e.g. console.log('Hello');";
        bodyInput.dataset.role = "body";
        bodyLabel.appendChild(bodyInput);
        controls.appendChild(bodyLabel);
    } else if (schema.kind === "console-log") {
        const messageLabel = document.createElement("label");
        messageLabel.textContent = "Message:";
        const messageInput = document.createElement("input");
        messageInput.type = "text";
        messageInput.placeholder = "e.g. Hello";
        messageInput.dataset.role = "message";
        messageLabel.appendChild(messageInput);
        controls.appendChild(messageLabel);
    } else if (schema.kind === "query-selector") {
        const selectorLabel = document.createElement("label");
        selectorLabel.textContent = "Selector:";
        const selectorInput = document.createElement("input");
        selectorInput.type = "text";
        selectorInput.placeholder = "e.g. body";
        selectorInput.dataset.role = "selector";
        selectorLabel.appendChild(selectorInput);
        controls.appendChild(selectorLabel);
    }
}

function getSelectCustomization(select) {
    const container = select.closest(".select-container");
    const controls = container ? container.querySelector(".customization-controls") : null;

    if (!controls || controls.classList.contains("hidden")) {
        return {};
    }

    return {
        inputType: controls.querySelector("[data-role='input-type']")?.value || "",
        content: controls.querySelector("[data-role='content']")?.value.trim() || "",
        property: controls.querySelector("[data-role='property']")?.value.trim() || "",
        value: controls.querySelector("[data-role='value']")?.value.trim() || "",
        name: controls.querySelector("[data-role='name']")?.value.trim() || "",
        body: controls.querySelector("[data-role='body']")?.value.trim() || "",
        message: controls.querySelector("[data-role='message']")?.value.trim() || "",
        selector: controls.querySelector("[data-role='selector']")?.value.trim() || "",
        id: controls.querySelector("[data-role='id']")?.value.trim() || ""
    };
}

function renderSelectedValue(value, select, panel) {
    if (panel.dataset.lang === "html") {
        const tagName = getTagNameFromValue(value);
        const customization = getSelectCustomization(select);
        const idAttribute = customization.id ? ` id="${escapeAttribute(customization.id)}"` : "";

        if (tagName === "input") {
            const inputType = customization.inputType || "text";
            const inputValue = customization.content || "";
            return inputValue
                ? `<input${idAttribute} type="${inputType}" value="${escapeAttribute(inputValue)}">`
                : `<input${idAttribute} type="${inputType}">`;
        }

        if (["button", "div", "p", "span", "h1", "h2", "h3", "h4", "h5", "h6"].includes(tagName)) {
            const content = customization.content || "";
            const text = escapeHtml(content);
            if (tagName === "button") {
                return `<button${idAttribute}>${text}</button>`;
            }
            return `<${tagName}${idAttribute}>${text}</${tagName}>`;
        }

        if (tagName && value.startsWith("<") && !value.startsWith("</")) {
            return `<${tagName}${idAttribute}>`;
        }
    }

    if (panel.dataset.lang === "css") {
        const rawValue = String(value);
        if (rawValue === "\n") {
            return "\n";
        }

        const customization = getSelectCustomization(select);
        const propertyName = customization.property || "color";
        const propertyValue = customization.value || "red";
        const selector = String(value).trim().split("{")[0].trim() || "body";
        return `${selector} {\n  ${propertyName}: ${propertyValue};\n}`;
    }

    if (panel.dataset.lang === "js") {
        const customization = getSelectCustomization(select);
        const normalized = String(value).trim();

        if (normalized.includes("function")) {
            const functionName = customization.name || "myFunction";
            const functionBody = customization.body || "console.log('Hello');";
            return `function ${functionName}() {\n  ${functionBody}\n}`;
        }

        if (normalized.includes("console.log")) {
            const message = customization.message || "Hello";
            return `console.log('${message}');`;
        }

        if (normalized.includes("querySelector")) {
            const selectorName = customization.selector || "body";
            return `document.querySelector('${selectorName}');`;
        }
    }

    return value;
}

window.renderSelectedValue = renderSelectedValue;

function createSelect(panel) {
    const container = document.createElement("div");
    container.className = "select-container";

    const label = document.createElement("label");
    label.textContent = "Choose an option: ";

    const select = document.createElement("select");
    select.className = "tag-select";

    label.appendChild(select);
    container.appendChild(label);
    panel.querySelector(".selectArea").appendChild(container);

    populateSelect(select);

    updateCustomizationControls(container, select);
    select.addEventListener("change", function () {
        updateCustomizationControls(container, select);
        updateInfo(panel);
    });
}

function getSelectedValues(panel) {
    return Array.from(panel.querySelectorAll(".selectArea .tag-select"))
        .map(select => select.value)
        .filter(value => value);
}

function isLinkableTag(value, panel) {
    return panel.dataset.lang === "html" && (value === "<button></button>" || value === getCustomTagMarkup(panel));
}

function updateInfo(panel) {
    const values = getSelectedValues(panel);
    const infoText = panel.querySelector(".info");

    if (panel.dataset.lang !== "html") {
        infoText.textContent = "";
        return;
    }

    const hasLinkableTag = values.some(value => isLinkableTag(value, panel));
    const customUrlInput = panel.querySelector(".customUrl");
    const customUrl = customUrlInput ? customUrlInput.value.trim() : "";
    const linkSelect = panel.querySelector(".linkSelect");
    const linkMessages = {
        none: "button X Google.",
        google: "button O Google."
    };

    if (hasLinkableTag && linkSelect.value === "google") {
        infoText.textContent = linkMessages.google;
    } else if (hasLinkableTag && (linkSelect.value === "none" || customUrl)) {
        infoText.textContent = customUrl ? `Custom URL active: ${customUrl}` : linkMessages.none;
    } else {
        infoText.textContent = "";
    }
}

function initializePanel(panel) {
    panel.querySelectorAll(".selectArea .tag-select").forEach(select => {
        populateSelect(select);
        updateCustomizationControls(select.closest(".select-container"), select);
        select.addEventListener("change", function () {
            updateCustomizationControls(select.closest(".select-container"), select);
            updateInfo(panel);
        });
    });

    panel.querySelector(".customTag").addEventListener("input", function () {
        panel.querySelectorAll(".selectArea .tag-select").forEach(select => {
            populateSelect(select);
            updateCustomizationControls(select.closest(".select-container"), select);
        });
        updateInfo(panel);
    });

    const customUrlField = panel.querySelector(".customUrl");
    if (customUrlField) {
        customUrlField.addEventListener("input", function () {
            updateInfo(panel);
        });
    }

    const linkSelectField = panel.querySelector(".linkSelect");
    if (linkSelectField) {
        linkSelectField.addEventListener("change", function () {
            updateInfo(panel);
        });
    }

    panel.querySelector(".selectArea").addEventListener("change", function (event) {
        if (event.target.tagName === "SELECT" && !event.target.classList.contains("tag-select")) {
            updateInfo(panel);
        }
    });

    panel.querySelector(".addSelectBtn").addEventListener("click", function () {
        createSelect(panel);
        updateInfo(panel);
    });

    panel.querySelector(".addBtn").addEventListener("click", function () {
        const textarea = panel.querySelector("textarea");
        const selects = Array.from(panel.querySelectorAll(".selectArea .tag-select"));
        const values = selects.map(select => select.value).filter(value => value);
        const customTag = panel.querySelector(".customTag").value.trim();
        const customUrlField = panel.querySelector(".customUrl");
        const customUrl = customUrlField ? customUrlField.value.trim() : "";
        const linkSelectField = panel.querySelector(".linkSelect");

        if (values.length === 0) {
            alert("Please select an option first.");
            return;
        }

        const renderedValues = values.map((value, index) => {
            const select = selects[index];
            if (panel.dataset.lang === "html") {
                const shouldWrap = isLinkableTag(value, panel) && (linkSelectField && (linkSelectField.value === "google" || customUrl));
                if (shouldWrap) {
                    const wrapUrl = customUrl || "https://google.com";
                    const tagMarkup = value === "<button></button>"
                        ? "<button></button>"
                        : `<${customTag}></${customTag}>`;
                    return `<a href="${wrapUrl}">\n ${tagMarkup}\n</a>`;
                }
            }
            return renderSelectedValue(value, select, panel);
        });

        textarea.value += (textarea.value ? " " : "") + renderedValues.join(" ");
        updateInfo(panel);
    });

    panel.querySelector(".clearBtn").addEventListener("click", function () {
        panel.querySelector("textarea").value = "";
    });

    panel.querySelector(".download-btn").addEventListener("click", function () {
        const textarea = panel.querySelector("textarea");
        const fileName = this.dataset.file || "file.txt";
        const blob = new Blob([textarea.value], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    });

    updateInfo(panel);
}

const languageSelect = document.getElementById("language");
languageSelect.addEventListener("change", function () {
    setLanguage(this.value);
});

document.querySelectorAll(".language-panel").forEach(initializePanel);
setLanguage(languageSelect.value);
</script></body>
</html>
